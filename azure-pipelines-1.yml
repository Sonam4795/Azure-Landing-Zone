trigger: none
pool: devops agent pool
parameters:
- name: environment          # name of the parameter; required
  type: string            # see the enum data types in the following section
  default: dev          # default value; if no default, then the parameter MUST be given by the user at runtime
  values:
  - dev
  - prod
  - test    # allowed list of values (for some data types)

variables:
 working_directory: $(System.DefaultWorkingDirectory)/environment ${{ parameters.environment }}
 service_connection: 'ADO SERVICE CONNECTION'
 resource_group_name: 'JD-group'
 storage_account_name: 'storagegoldselver'
 container_name: 'stplcontener'
 key: 'terraform.tfstate'

stages:
- stage: terraforminit
  displayName: terraform init
  
  jobs:
  - job: terraforminit
    displayName: terraform init

    steps:
    - task: TerraformInstaller@1
      displayName: terraform installer
      inputs:
        terraformVersion: 'latest'
    - task: PowerShell@2
      inputs:
        targetType: 'inline'
        script: |
          - powershell: |
              Write-Host "=== Terraform Check ==="
          
              $tf = "D:\devops agent pool\_work\_tool\terraform\1.16.4\x64\terraform.exe"
          
              Write-Host "Terraform exists:"
              Test-Path $tf
          
              Write-Host "Terraform version:"
              & $tf version
          
              Write-Host "Current user:"
              whoami
          
            displayName: 'Check Terraform from Agent'
    - task: TerraformTask@5
      displayName: terraform init
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: $(working_directory)
        backendServiceArm: $(service_connection)
        backendAzureRmResourceGroupName: $(resource_group_name)
        backendAzureRmStorageAccountName: $(storage_account_name)
        backendAzureRmContainerName: $(container_name)
        backendAzureRmKey: $(key)

    - task: TerraformTask@5
      displayName: terraform fmt
      inputs:
        provider: 'azurerm'
        command: 'custom'
        workingDirectory: $(working_directory)
        outputTo: 'console'
        customCommand: 'fmt'
        environmentServiceNameAzureRM: $(service_connection)

    - task: TerraformTask@5
      displayName: terraform validate
      inputs:
        provider: 'azurerm'
        command: 'validate'
        workingDirectory: $(working_directory)

    - task: TerraformTask@5
      displayName: terraform plan
      inputs:
        provider: 'azurerm'
        command: 'plan'
        workingDirectory: $(working_directory)
        environmentServiceNameAzureRM: $(service_connection)


