trigger: none
pool: devops agent pool
parameters:
- name: environment          # name of the parameter; required
  type: environment            # see the enum data types in the following section
  default: dev          # default value; if no default, then the parameter MUST be given by the user at runtime
  values:
  - dev
  - prod    # allowed list of values (for some data types)
variables:
 working_directory: $(System.DefaultWorkingDirectory) ${{ parameters.environment }}
 service_connection: 'ADO SERVICE CONNECTION'

stages:
- stage: terraforminit
  displayName: terraform init
  
  jobs:
  - job: terraforminit
    displayName: terraform init

    steps:
    - task: TerraformInstaller@1
      inputs:
        terraformVersion: 'latest'
    - task: TerraformTask@5
      displayName: terraform init
    

      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: $(working_directory)
        backendServiceArm: $(service_connection)
        backendAzureRmResourceGroupName: 'dev-rg'
        backendAzureRmStorageAccountName: 'devstg12345'
        backendAzureRmContainerName: 'devstgcontainer'
        backendAzureRmKey: 'terraform.tfstate'

    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'custom'
        workingDirectory: $(working_directory)
        outputTo: 'console'
        customCommand: 'fmt'
        environmentServiceNameAzureRM: $(service_connection)

    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'validate'
        workingDirectory: $(working_directory)

    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'plan'
        workingDirectory: $(working_directory)
        environmentServiceNameAzureRM: $(service_connection)


