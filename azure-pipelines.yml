trigger: none
pool: devops agent pool
stages:
- stage: terraforminstaller  
  displayName: terraform installer

  jobs:
  - job: terraforminstaller
    displayName: terraform installer

    steps:
    - task: TerraformInstaller@1
      inputs:
        terraformVersion: 'latest'
- stage: terraforminit
  displayName: terraform init
  jobs:
  - job: terraforminit
    displayName: terraform init

    steps:
    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(System.DefaultWorkingDirectory)/environment/dev'
        backendServiceArm: 'azure devops service connection'
        backendAzureRmOverrideSubscriptionID: '3932b5be-57e9-448f-8092-d5058b82f170'
        backendAzureRmResourceGroupName: 'pinki'
        backendAzureRmStorageAccountName: 'whitedrum'
        backendAzureRmContainerName: 'stgcontainer'
        backendAzureRmKey: 'terraform.tfkey'

- stage: terraformfmtvalidateplan
  displayName: terraform fmt validate and plan
  jobs:
  - job: terraformfmtvalidateplan
    displayName: terraform fmt validate and plan

    steps:
    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(System.DefaultWorkingDirectory)/environment/dev'
        backendServiceArm: 'azure devops service connection'
        backendAzureRmResourceGroupName: 'pinki'
        backendAzureRmStorageAccountName: 'whitedrum'
        backendAzureRmContainerName: 'stgcontainer'
        backendAzureRmKey: 'terraform.tfkey'
    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'custom'
        workingDirectory: '$(System.DefaultWorkingDirectory)/environment/dev/'
        outputTo: 'console'
        customCommand: 'fmt'
        environmentServiceNameAzureRM: 'azure devops service connection'
    
    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'validate'
        workingDirectory: '$(System.DefaultWorkingDirectory)/environment/dev/'

    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'plan'
        workingDirectory: '$(System.DefaultWorkingDirectory)/environment/dev/'
        environmentServiceNameAzureRM: 'azure devops service connection'

- stage: terraformapply
  displayName: terraform apply
  jobs:
  - job: terraformapply
    displayName: terraform apply

    steps:
    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(System.DefaultWorkingDirectory)/environment/dev/'
        backendServiceArm: 'azure devops service connection'
        backendAzureRmResourceGroupName: 'pinki'
        backendAzureRmStorageAccountName: 'whitedrum'
        backendAzureRmContainerName: 'stgcontainer'
        backendAzureRmKey: 'terraform.tfkey'

    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'apply'
        workingDirectory: '$(System.DefaultWorkingDirectory)/environment/dev/'
        environmentServiceNameAzureRM: 'azure devops service connection'
    

    
