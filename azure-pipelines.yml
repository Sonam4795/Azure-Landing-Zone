- stage: terraformapply
  displayName: terraform apply
  dependsOn: terraforminit
  jobs:
  - job: manualvalidation
    displayName:  manual validation
    pool: server
    steps:
    - task: ManualValidation@1
      inputs:
        notifyUsers: 'sona.mahi1995@gmail.com'
        approvers: 'sona.mahi1995@gmail.com'
    

  - job: terraformapply
    displayName: terraform apply
    dependsOn: manualvalidation
    

    steps:
    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(System.DefaultWorkingDirectory)/environment/dev/'
        backendServiceArm: 'ADO SERVICE CONNECTION'
        backendAzureRmResourceGroupName: 'dev-rg'
        backendAzureRmStorageAccountName: 'devstg12345'
        backendAzureRmContainerName: 'devstgcontainer'
        backendAzureRmKey: 'terraform.tfstate'

    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'apply'
        workingDirectory: '$(System.DefaultWorkingDirectory)/environment/dev/'
        environmentServiceNameAzureRM: 'ADO SERVICE CONNECTION'
    

    
