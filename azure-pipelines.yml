trigger: none
pool: devops agent pool
stages:
- stage: terraforminstaller  
  displayName: terraform installer

  jobs:
  - job: terraforminstaller
    displayName: terraform installer

    steps:
    - task: TerraformInstaller@1
      inputs:
        terraformVersion: 'latest'

- stage: terraforminit
  displayName: terraform init
  jobs:
  - job: terraforminit
    displayName: terraform init

    steps:
    - task: TerraformTask@5
      displayName: terraform init

      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(System.DefaultWorkingDirectory)/environment/dev'
        backendServiceArm: 'ADO SERVICE CONNECTION'
        backendAzureRmResourceGroupName: 'dev-rg'
        backendAzureRmStorageAccountName: 'devstg123'
        backendAzureRmContainerName: 'devstgcontainer'
        backendAzureRmKey: 'terraform.tfstate'

- stage: terraformfmtvalidateplan
  displayName: terraform fmt validate and plan
  jobs:
  - job: terraformfmtvalidateplan
    displayName: terraform fmt validate and plan

    steps:
    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(System.DefaultWorkingDirectory)/environment/dev'
        backendServiceArm: 'ADO SERVICE CONNECTION'
        backendAzureRmResourceGroupName: 'dev-rg'
        backendAzureRmStorageAccountName: 'devstg123'
        backendAzureRmContainerName: 'devstgcontainer'
        backendAzureRmKey: 'terraform.tfstate'
    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'custom'
        workingDirectory: '$(System.DefaultWorkingDirectory)/environment/dev/'
        outputTo: 'console'
        customCommand: 'fmt'
        environmentServiceNameAzureRM: 'ADO SERVICE CONNECTION'
    
    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'validate'
        workingDirectory: '$(System.DefaultWorkingDirectory)/environment/dev/'

    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'plan'
        workingDirectory: '$(System.DefaultWorkingDirectory)/environment/dev/'
        environmentServiceNameAzureRM: 'ADO SERVICE CONNECTION'

- stage: terraformapply
  displayName: terraform apply
  jobs:
  - job: terraformapply
    displayName: terraform apply

    steps:
    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(System.DefaultWorkingDirectory)/environment/dev/'
        backendServiceArm: 'ADO SERVICE CONNECTION'
        backendAzureRmResourceGroupName: 'dev-rg'
        backendAzureRmStorageAccountName: 'devstg123'
        backendAzureRmContainerName: 'devstgcontainer'
        backendAzureRmKey: 'terraform.tfstate'

    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'apply'
        workingDirectory: '$(System.DefaultWorkingDirectory)/environment/dev/'
        environmentServiceNameAzureRM: 'ADO SERVICE CONNECTION'
    

    
