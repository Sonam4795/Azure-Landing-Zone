trigger: none
pool: devops agent pool
# variables:
#  working_directory: $(System.DefaultWorkingDirectory)/environment/dev
stages:
- stage: terraforminit
  displayName: terraform init
  
  jobs:
  - job: terraforminit
    displayName: terraform init

    steps:
    - task: TerraformInstaller@1
      inputs:
        terraformVersion: 'latest'
    - task: TerraformTask@5
      displayName: terraform init
    

      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(System.DefaultWorkingDirectory)/environment/dev'
        #working_directory: $(working_directory)
        backendServiceArm: 'ADO SERVICE CONNECTION'
        backendAzureRmResourceGroupName: 'dev-rg'
        backendAzureRmStorageAccountName: 'devstg12345'
        backendAzureRmContainerName: 'devstgcontainer'
        backendAzureRmKey: 'terraform.tfstate'

    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'custom'
        workingDirectory: '$(System.DefaultWorkingDirectory)/environment/dev'
        outputTo: 'console'
        customCommand: 'fmt'
        environmentServiceNameAzureRM: 'ADO SERVICE CONNECTION'

    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'validate'
        workingDirectory: '$(System.DefaultWorkingDirectory)/environment/dev/'

    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'plan'
        workingDirectory: '$(System.DefaultWorkingDirectory)/environment/dev/'
        environmentServiceNameAzureRM: 'ADO SERVICE CONNECTION'


